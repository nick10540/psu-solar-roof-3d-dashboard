name = "psu-solar-solaredge-backend"
main = "worker.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Secrets — set with `wrangler secret put <NAME>`, never in this file:
#   SOLAREDGE_API_KEY

[vars]
SOLAREDGE_API_BASE = "https://monitoringapi.solaredge.com/v2"
# หาดใหญ่ is three registrations (4956359 + 4956575 + 4956547), summed onto one
# pin by the dashboard; ตรัง and ปัตตานี are one each.
SOLAREDGE_SITE_IDS = "4956359,4956575,4956547,4821237,4947126"
ALLOWED_ORIGINS = "http://localhost:3000"

# Spend ceilings. Per-minute matches the upgraded package (50, was 10) and the
# backend waits rather than bursting past it — setting it higher than the
# account allows only moves the refusal upstream. The monthly figure is a guard
# against silent overspend. At the 3600 s default it is no longer close: the
# five registrations above spend ~605 calls/day, ~18k in a 30-day month, and all
# seven that SITE_REGISTRY knows would be ~25k. (At a 900 s default those same
# seven came to ~101k, right on this guard.) Turning the cadence back down is
# what puts it in play again — check the settings panel's live figure when you
# do. See worker/.dev.vars.example.
SOLAREDGE_MAX_CALLS_PER_MIN = "50"
SOLAREDGE_MONTHLY_CALL_BUDGET = "100000"

# Fallback cadence in seconds for a request that carries none — /power-flow, the
# live kW. The dashboard sends its own per-site value and that wins. Floor is 10
# either way. At 3600 the board asks once an hour, and since nothing is fetched
# without a request, the quarter-hour series ride that same hourly tick: five
# upstream calls per site per hour, everything on screen up to an hour old.
SOLAREDGE_POWER_FLOW_INTERVAL_SEC = "3600"
# Read by nothing: the series group is pinned at SERIES_INTERVAL_SEC (900 s) in
# worker/src/config.ts. Kept only so an older deploy's vars still load.
SOLAREDGE_ENERGY_INTERVAL_SEC = "1800"
