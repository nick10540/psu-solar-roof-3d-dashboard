# nginx.conf
# Static-file server for the PSU Solar Roof 3D Dashboard SPA.
#
# The dashboard registers a service worker (public/sw-tiles.js) at scope "/"
# to cache map tiles (see src/services/tileCacheService.ts) - that file and
# index.html must always be revalidated so an update actually reaches the
# 72" TV kiosk. Vite's hashed build assets are the opposite: the filename
# changes with the content, so they're safe to cache forever.

server {
    listen 3001;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # HTTP Basic auth - the only thing standing between this dashboard and
    # anyone who can reach port 3001. The included file is written at container
    # start by docker/docker-entrypoint.d/25-basic-auth.sh out of the compose
    # environment, so no credential is committed or baked into an image layer.
    #
    # Included at SERVER level, not per location, so it is inherited by every
    # location below alike: the SPA, the hashed assets, the MapLibre worker,
    # the service worker and the /api/solaredge proxy. A location added later
    # is therefore protected by default and forgetting to protect one is not
    # possible. /healthz is the single deliberate exception.
    #
    # If the file is missing nginx refuses to start, which is the behaviour we
    # want: the dashboard must never come up unprotected because a step was
    # skipped.
    include /etc/nginx/auth-basic.conf;

    gzip on;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed JS/CSS output of `vite build` (dist/assets/*-<hash>.{js,css}).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # MapLibre's web worker, emitted un-hashed by maplibreWorkerAssets() in
    # vite.config.ts. Two things in this block are load-bearing, and getting
    # either wrong breaks the site link line and NOTHING ELSE:
    #
    #  - The MIME type. A module worker is refused outright under anything that
    #    is not a JavaScript type, and nginx only maps `.mjs` from 1.21.1 on -
    #    an older image serves it as application/octet-stream. Forced here so
    #    the answer does not depend on the base image's mime.types.
    #
    #  - `=404`. Without it a missing file falls through to the SPA fallback
    #    below and nginx answers index.html with a 200, so the browser refuses
    #    a text/html module script. Either way the failure is SILENT: raster
    #    tiles do not go through the worker, so the map looks perfectly
    #    healthy while every worker-backed source stays unloaded for ever,
    #    drawing nothing and raising nothing. The only trace is one console
    #    line - "Failed to load module script: ... non-JavaScript MIME type".
    #
    # no-cache rather than immutable: these filenames carry no content hash, so
    # a maplibre-gl upgrade would otherwise never reach the kiosk. Revalidation
    # costs a 304.
    location /maplibre/ {
        types { }
        default_type text/javascript;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Tile-cache service worker: must be re-fetched every load, never cached.
    location = /sw-tiles.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SolarEdge backend. Keeping this same-origin is the point: the OAuth client
    # secret lives in that container, the browser never sees a credential, and
    # no CORS is involved. Without this block the SPA's /api/solaredge calls
    # would fall through to the SPA fallback below and get index.html back.
    location /api/solaredge {
        proxy_pass http://solaredge-backend:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Responses carry live readings and a token TTL — never cache them,
        # at any layer.
        add_header Cache-Control "no-store" always;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Container liveness probe, and the ONLY path exempt from the password.
    #
    # `auth_basic off` because docker's healthcheck sends no credentials: with
    # auth on it reads 401 and compose reports a perfectly healthy container as
    # unhealthy for ever, which in turn holds up anything with a
    # `depends_on: service_healthy`. Exempting it leaks nothing - the response
    # is a fixed two-byte string, with no build, version or config in it.
    #
    # access_log off: this fires every 30s, all day, on a kiosk that runs for
    # weeks.
    #
    # All three access directives are needed, not just auth_basic. With
    # BASIC_AUTH_ALLOW_IPS set, the included file adds `satisfy any` and
    # `deny all` at server level and both are inherited here; `auth_basic off`
    # on its own would leave this path's fate resting on the order nginx runs
    # its access-phase handlers in. So the inherited rules are reset outright:
    # `allow all` replaces the whole inherited allow/deny list, and
    # `satisfy all` puts this location back on the default all-checks-pass
    # footing. Explicit beats clever for the one path that must answer 200 to
    # an unauthenticated prober.
    location = /healthz {
        satisfy all;
        allow all;
        auth_basic off;
        access_log off;
        return 200 "ok\n";
    }

    # SPA fallback: unmatched routes resolve to index.html on the client.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
