services:
  psu-solar-roof-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psu-solar-roof-dashboard
    ports:
      - "3001:3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
