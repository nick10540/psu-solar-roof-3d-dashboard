services:
  # Static SPA + reverse proxy. The browser only ever talks to this service, so
  # /api/solaredge stays same-origin and the backend is never exposed directly.
  psu-solar-roof-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psu-solar-roof-dashboard
    ports:
      - "3001:3001"
    depends_on:
      - solaredge-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # SolarEdge OAuth backend. Holds the client id/secret and the refresh token;
  # deliberately has NO published port — nginx reaches it over the compose
  # network, and nothing outside the stack can.
  solaredge-backend:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: psu-solar-solaredge-backend
    restart: unless-stopped
    environment:
      # Either a Fleet API Key (covers all sites, no consent) or the OAuth pair.
      SOLAREDGE_API_KEY: ${SOLAREDGE_API_KEY:-}
      SOLAREDGE_CLIENT_ID: ${SOLAREDGE_CLIENT_ID:-}
      SOLAREDGE_CLIENT_SECRET: ${SOLAREDGE_CLIENT_SECRET:-}
      # Per-site seeds are optional; the connect flow writes them to the volume.
      SOLAREDGE_REFRESH_TOKEN_4956359: ${SOLAREDGE_REFRESH_TOKEN_4956359:-}
      SOLAREDGE_REFRESH_TOKEN_4821237: ${SOLAREDGE_REFRESH_TOKEN_4821237:-}
      SOLAREDGE_REFRESH_TOKEN_4947126: ${SOLAREDGE_REFRESH_TOKEN_4947126:-}
      SOLAREDGE_SITE_IDS: ${SOLAREDGE_SITE_IDS:-4956359,4821237,4947126}
    volumes:
      # The refresh token rotates on every use. Persist it, or a rebuild forces
      # the SolarEdge consent flow to be redone by hand.
      - solaredge-token:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8787/api/solaredge/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  solaredge-token:
