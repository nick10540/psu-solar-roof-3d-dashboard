services:
  # Static SPA + reverse proxy. The browser only ever talks to this service, so
  # /api/solaredge stays same-origin and the backend is never exposed directly.
  psu-solar-roof-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psu-solar-roof-dashboard
    ports:
      - "3001:3001"
    depends_on:
      - solaredge-backend
    restart: unless-stopped
    environment:
      # HTTP Basic auth, applied by nginx to this whole origin - the SPA and
      # the /api/solaredge proxy alike. Required, not optional: the container's
      # entrypoint refuses to start without it, so the dashboard cannot be
      # published to the venue network unprotected because someone forgot a
      # line in .env. See docker/docker-entrypoint.d/25-basic-auth.sh.
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?set BASIC_AUTH_USER in .env}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:?set BASIC_AUTH_PASSWORD in .env}
      # Shown in the browser's password prompt.
      BASIC_AUTH_REALM: ${BASIC_AUTH_REALM:-PSU Solar Roof Dashboard}
      # Optional, comma-separated CIDRs that skip the prompt entirely - meant
      # for the kiosk PC, so the 72" TV comes back up unattended after a power
      # cut. Everyone else still needs the password. Empty = no exemptions.
      BASIC_AUTH_ALLOW_IPS: ${BASIC_AUTH_ALLOW_IPS:-}
      # Optional pre-hashed htpasswd line(s); wins over USER/PASSWORD above.
      # The way to use bcrypt, or more than one account.
      BASIC_AUTH_HTPASSWD: ${BASIC_AUTH_HTPASSWD:-}
    healthcheck:
      # /healthz, not /: it is the one path nginx leaves unauthenticated, and
      # wget carries no credentials, so probing / would report 401 for ever.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # SolarEdge backend. Holds the Fleet API Key;
  # deliberately has NO published port — nginx reaches it over the compose
  # network, and nothing outside the stack can.
  solaredge-backend:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: psu-solar-solaredge-backend
    restart: unless-stopped
    environment:
      SOLAREDGE_API_KEY: ${SOLAREDGE_API_KEY:?set SOLAREDGE_API_KEY in .env}
      # หาดใหญ่ is three registrations (4956359 + 4956575 + 4956547), summed
      # onto one pin by the dashboard.
      SOLAREDGE_SITE_IDS: ${SOLAREDGE_SITE_IDS:-4956359,4956575,4956547,4821237,4947126}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8787/api/solaredge/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

