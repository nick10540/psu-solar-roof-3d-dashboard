    <meta name="description" content="ระบบติดตามและแดชบอร์ดแสดงผลการผลิตไฟฟ้าพลังงานแสงอาทิตย์ Solar Roof 3D Interactive มหาวิทยาลัยสงขลานครินทร์ วิทยาเขตหาดใหญ่" />
    
    <!-- Early suppression of injected third-party browser extension errors (e.g. MetaMask/Web3) -->
    <script>
      (function() {
        var isExtError = function(str) {
          if (!str) return false;
          var s = String(str).toLowerCase();
          return s.indexOf('metamask') !== -1 || 
                 s.indexOf('ethereum') !== -1 || 
                 s.indexOf('wallet') !== -1 || 
                 s.indexOf('evm') !== -1 || 
                 s.indexOf('web3') !== -1;
        };

        window.addEventListener('error', function(e) {
          if (isExtError(e.message) || (e.error && isExtError(e.error.message))) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason ? (e.reason.message || e.reason) : '';
          if (isExtError(reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
